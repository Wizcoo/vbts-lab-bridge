name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integrity-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q tools
      - run: python -m pip install -r device/requirements.txt
      - run: python -m unittest discover -s device -p 'test_*.py' -v
      - run: python -m compileall -q device
